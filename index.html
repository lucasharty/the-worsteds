<style>
/* Augusta look: fairway greens, tournament yellow, azalea pink. Lexend, solid fills, pills. One column, big tap targets, thumb first. */
:root{
  --bg:#00301F;--panel:#006747;--well:#004E36;--press:#00593D;--stripe:#00704D;
  --ink:#FFFFFF;--mute:#D5EADD;--accent:#FFD530;--on-accent:#00301F;--tint:rgba(255,255,255,.14);--clay:#FFD530;--sand:#D5EADD;--good:#FFFFFF;--azalea:#F9A8C4;
  --font:Lexend,system-ui,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:22px}
body{padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 40px)}
.lbl{font-size:12px;line-height:15px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--sand)}
.dsp{font-weight:800;text-transform:uppercase;line-height:1.15;text-wrap:balance;margin:0}
.title{font-size:26px;color:var(--accent)}
.sub{font-size:13px;line-height:18px;font-weight:600;color:var(--mute);margin:0}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--panel);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head>div{min-width:0;flex:1}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.btn{background:var(--panel);border:none;border-radius:999px;min-height:48px;padding:0 18px;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:active{background:var(--press)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.ico:focus-visible,.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pri{background:var(--accent);color:var(--on-accent);font-weight:700}
.pri:active{background:#E6BE1E}
.hero{background:repeating-linear-gradient(90deg,var(--panel) 0 30px,var(--stripe) 30px 60px);border-radius:18px;padding:16px 14px}
.pin{width:30px;height:30px;flex:none}
.titlerow{display:flex;align-items:center;gap:8px}
.big{min-height:58px;font-size:17px;width:100%}
.well{background:var(--well)}
.grow{flex:1}
.ico{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:var(--panel);display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:17px;padding:0}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:4px;background:var(--panel);border-radius:999px;padding:4px;align-items:center}
.seg span{padding:0 10px 0 12px;font-size:13px;font-weight:700;color:var(--sand)}
.seg button{flex:1;min-height:44px;border:none;border-radius:999px;background:transparent;color:var(--mute);font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pick{min-height:58px;border:none;border-radius:14px;background:var(--well);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;touch-action:manipulation}
.pick b{font-weight:700;font-size:14px;line-height:18px}
.pick small{font-size:12px;line-height:15px;color:var(--mute);font-weight:500}
.pick.on{background:var(--accent);color:var(--on-accent)}
.pick.on small{color:var(--on-accent)}
.pick:disabled{opacity:.35}
.name{font-weight:800;font-size:17px}
.tag{font-size:12px;line-height:16px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--well);white-space:nowrap}
.tag.live{background:var(--azalea);color:var(--on-accent)}
.tag.ok{background:var(--good);color:var(--on-accent)}
.banner{padding:12px 16px;border-radius:18px;background:var(--tint);font-size:14px;line-height:20px;font-weight:600}
.banner.hot{background:rgba(255,213,48,.2)}
.segscore{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.segscore .v{font-weight:800;font-size:32px;line-height:38px}
.segscore .n{font-size:13px;font-weight:600;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{position:sticky;bottom:0;margin-top:auto;padding:10px 0 max(6px,env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 14px);display:flex;gap:8px}
.foot .btn{min-height:58px}
.rd{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;padding:10px 14px;border:none;border-radius:18px;background:var(--panel);text-align:left;cursor:pointer}
.rd:disabled{cursor:default;color:var(--mute)}
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-weight:700;text-align:right;padding:6px 0 6px 8px;color:var(--sand);font-size:13px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board th:first-child,.board td:first-child{text-align:left;padding-left:0}
.board td{padding:8px 0 8px 8px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.board td:first-child{color:var(--mute)}
.board tr.total td{font-weight:800;font-size:18px;color:var(--ink);border-top:1px solid var(--press);padding-top:10px}
.champ{font-size:34px;color:var(--accent)}
.match{display:flex;flex-direction:column;gap:8px}
.status{text-align:center;padding:24px 14px}
.status .dsp{font-size:30px;color:var(--accent)}
#toast{position:fixed;top:max(12px,env(safe-area-inset-top,0px));left:16px;right:16px;z-index:8;display:flex;justify-content:center;pointer-events:none}
.toast{width:100%;max-width:528px;padding:14px 16px;border-radius:18px;display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 26px rgba(0,0,0,.45);animation:drop .22s ease-out}
.toast b{font-weight:700;font-size:16px;line-height:22px}
.toast small{font-size:13px;line-height:17px;font-weight:600}
.toast.good{background:var(--accent);color:var(--on-accent)}
.toast.bad{background:var(--azalea);color:var(--on-accent)}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.parg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.part{min-height:62px;border:none;border-radius:12px;background:var(--well);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;touch-action:manipulation}
.part:active{background:var(--press)}
.part small{font-size:12px;line-height:15px;font-weight:600;color:var(--mute)}
.part b{font-size:22px;line-height:26px;font-weight:800;color:var(--accent)}
.part:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp{width:100%;background:var(--well);border:none;border-radius:999px;min-height:48px;padding:0 18px;font-size:16px}
.hero .ico{background:var(--well)}
.lnk{background:none;border:none;color:var(--mute);font-weight:600;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sheetbg{position:fixed;inset:0;background:rgba(0,48,31,.78);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:86dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:20px;color:var(--clay)}
.sheet h3{font-size:14px;margin:6px 0 0;color:var(--sand)}
.sheet p{margin:0;font-size:14px;line-height:21px}
.sheet .q{font-weight:700;margin-top:4px}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--sand)}
.sheet input{background:var(--well);border:none;border-radius:999px;min-height:48px;padding:0 18px;font-size:16px}
.sheet .board td,.sheet .board th{padding-top:5px;padding-bottom:5px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden aria-label="Backup file">
<div id="toast" role="status" aria-live="polite"></div>
<script>
const SEGS=[{from:0,to:6,worth:1,label:'Holes 1-6',name:'Mulligan Meadows'},{from:6,to:12,worth:1,label:'Holes 7-12',name:'Beverage Cart Bend'},{from:12,to:18,worth:2,label:'Holes 13-18',name:'Collapse Corner'}];
/* {n} becomes the player's name. */
const QUIPS={

],

"Bogey. Nothing a cold drink won't fix.",

"That's a lot of effort for one point, {n}.",
"Bogey. The putter is in the doghouse.",

"Not a disaster, {n}. Not a highlight either.",

"A 13-handicap special from {n}.",

],

"Two points for {n}. The patrons nod quietly.",

"Right down the middle of boring, {n}. Beautiful.",

"Textbook par, {n}. Somebody wrote that textbook by accident.",
"Par! {n} can hold their head up at the snack bar.",
"Par! The Jacket shudders in its closet.",
"Solid par, {n}. Nobody's calling the papers, but still.",
"Par! {n} just stole two points from the golf gods.",
"Par. {n} tips their cap to an imaginary crowd.",
"Par! Even the ranger gave a thumbs up.",
"Par! {n}'s putter is out of the doghouse.",
"Nice par, {n}. Try to remember how you did that.",

"Clean card on that one, {n}. Frame it.",

],

"Birdie! {n} will mention this at lunch. Twice.",
"Birdie! Somebody check {n}'s bag for a hidden pro.",
"Birdie, {n}! The patrons are on their feet.",

],

],

],

"Back-to-back! {n} is on fire. Check the cart.",
"Hot Streak! Somebody throw water on {n}.",

let toastT=null;
/* Each round keeps its own list of used lines, so a line can't repeat in that round, even after closing the app. */
function quip(kind,name,r){
  const used=r.used||(r.used={}),u=used[kind]||(used[kind]=[]),list=QUIPS[kind];
  let open=list.map((_,i)=>i).filter(i=>!u.includes(i));
  if(!open.length){u.length=0;open=list.map((_,i)=>i);}
  const i=open[Math.floor(Math.random()*open.length)];
  u.push(i);return esc(list[i].split('{n}').join(name));
}
const hotNeeds=d=>d===-1?'Birdie':d===-2?'Eagle':'Albatross';
const isHot=(prev,d)=>prev!=null&&prev<=-1&&d!=null&&d<=prev;
function hideToast(){clearTimeout(toastT);document.getElementById('toast').innerHTML='';}
function showToast(p,v,hole,prev,r){
  const bounced=prev!=null&&prev>=2&&v<=0,hot=isHot(prev,v);
  const kind=hot?'hot':v>=2?'double':v===1?'bogey':v===0?'par':v===-1?'birdie':v===-2?'eagle':'albatross';
  const good=v<=0;
  const extra=hot?'+1 Hot Streak':bounced?'+1 Bounce-Back':'';
  const next=hole>=17?'':v>=2?'Bounce-Back is live on the next hole':v<=-1?`Hot Streak live: ${hotNeeds(v).toLowerCase()} or better next hole`:'';
  const notes=[extra,next].filter(Boolean).join(' · ');
  const t=document.getElementById('toast');
  t.innerHTML=`<div class="toast ${good?'good':'bad'}"><b>${quip(kind,S.names[p],r)}</b>${notes?`<small>${notes}</small>`:''}</div>`;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.innerHTML='';},2800);
}

const DEFAULT_PARS=[4,5,3,4,4,3,5,4,4,4,4,3,5,4,3,4,5,4];
const RESULTS=[[3,'Double+'],[1,'Bogey'],[0,'Par'],[-1,'Birdie'],[-2,'Eagle'],[-3,'Albatross']];
const blankRound=()=>({scores:[Array(18).fill(null),Array(18).fill(null)],hole:0,done:false});
const blankEvent=()=>({rounds:[blankRound(),blankRound(),blankRound()],skipR3:false,match:null});
const fresh=()=>({v:1,updated:0,names:['Joel','Lucas'],course:'',pars:DEFAULT_PARS.slice(),event:blankEvent(),history:[]});
const KEY='jacket-open-v1';
let S=fresh(),view={s:'home'},sample=false,realS=null,pendingRestore=null;

/* Scoring */
const pts=d=>d==null?0:d>=2?0:2-d;
function calc(r){
  const out=[0,1].map(p=>{
    const c=r.scores[p];let stable=0,bounce=0,streak=0;
    c.forEach((d,i)=>{if(d==null)return;stable+=pts(d);if(i>0&&c[i-1]!=null&&c[i-1]>=2&&d<=0)bounce++;if(i>0&&isHot(c[i-1],d))streak++;});
    return{stable,bounce,streak,seg:0,segs:SEGS.map(s=>c.slice(s.from,s.to).reduce((a,d)=>a+pts(d),0))};
  });
  const wins=SEGS.map((s,i)=>{
    const full=[0,1].every(p=>r.scores[p].slice(s.from,s.to).every(d=>d!=null));
    if(!full)return null;
    const a=out[0].segs[i],b=out[1].segs[i];
    if(a===b)return -1;
    const w=a>b?0:1;out[w].seg+=s.worth;return w;
  });
  out.forEach(o=>o.total=o.stable+o.seg+o.bounce+o.streak);
  return{p:out,wins};
}
const E=()=>S.event;
const doneRounds=()=>E().rounds.filter(r=>r.done);
function totals(){const t=[0,0];doneRounds().forEach(r=>{const c=calc(r);t[0]+=c.p[0].total;t[1]+=c.p[1].total;});return t;}
const matchReady=()=>{const r=E().rounds;return r[0].done&&r[1].done&&(r[2].done||E().skipR3);};
function currentRound(){const r=E().rounds;for(let i=0;i<3;i++){if(i===2&&E().skipR3)continue;if(!r[i].done)return i;}return -1;}
const started=r=>r.scores.some(c=>c.some(d=>d!=null));
function startLead(){const[a,b]=totals(),g=Math.abs(a-b);const n=g>=9?2:g>=4?1:0;return a>b?n:-n;}
function mState(m){
  let lead=m.start;m.holes.forEach(h=>{if(h===0)lead++;if(h===1)lead--;});
  const n=m.holes.length,left=Math.max(0,18-n);
  let winner=null,sd=false;
  if(n<18){if(Math.abs(lead)>left)winner=lead>0?0:1;}
  else if(n===18){if(lead!==0)winner=lead>0?0:1;else sd=true;}
  else{sd=true;const l=m.holes[n-1];if(l!==2)winner=l;}
  return{lead,n,left,winner,sd};
}
function leadText(lead){return lead===0?'All square':`${nm(lead>0?0:1)} ${Math.abs(lead)} up`;}
function resultText(st){
  if(st.n>18)return `in sudden death, ${st.n-18} extra ${st.n===19?'hole':'holes'}`;
  if(st.left===0)return `${Math.abs(st.lead)} up`;
  return `${Math.abs(st.lead)} & ${st.left}`;
}

/* Screens */

function homeScreen(){

function weekScreen(){
  const e=E(),cur=currentRound(),[a,b]=totals(),any=doneRounds().length>0;
  const last=S.history[S.history.length-1];
  let h=sampleBar()+`<div class="head">${backHome}<div><div class="lbl">${nm(0)} vs. ${nm(1)}</div><h1 class="dsp title">Standings</h1></div>${help}</div>`;
  if(last&&!any&&!started(e.rounds[0])){
    h+=`<div class="banner hot">${esc(last.loser)} wears the Jacket for Round 1, and introduces ${esc(last.champ)} on the first tee in full TV announcer voice.</div>`;
  }

    h+=`<button class="rd" ${r.done?`data-a="viewRound" data-i="${i}"`:i===cur?`data-a="play"`:'disabled'}><span><span class="name" style="font-size:15px">Round ${i+1}</span><br><span class="sub">Stableford and bonuses</span></span>${state}</button>`;
  });

  h+='<div class="foot" style="flex-direction:column">';

  else h+=`<button class="btn pri big" data-a="match">${m?'Resume':'Start'} Sunday Match</button>`;

  h+='</div>';

}

function playerCard(p,r,i){
  const par=S.pars[i],c=r.scores[p],d=c[i],prev=i>0?c[i-1]:null;
  const live=prev!=null&&prev>=2;
  const hotLive=prev!=null&&prev<=-1;
  const tag=live?(d==null?'<span class="tag live">Bounce-Back live</span>':d<=0?'<span class="tag ok">+1 Bounce-Back</span>':''):hotLive?(d==null?`<span class="tag live">Hot Streak: ${hotNeeds(prev)}+</span>`:isHot(prev,d)?'<span class="tag ok">+1 Hot Streak</span>':''):'';
  const btns=RESULTS.map(([v,l])=>{
    const dis=par+v<1;
    const strokes=v===3?`${par+2}+`:par+v;
    const p2=v===3?0:2-v;
    return `<button class="pick ${d===v?'on':''}" data-a="score" data-p="${p}" data-v="${v}" ${dis?'disabled':''} aria-pressed="${d===v}"><b>${l}</b><small class="num">${strokes} · ${p2} pt${p2===1?'':'s'}</small></button>`;
  }).join('');
  return `<div class="card"><div class="row between"><span class="name">${nm(p)}</span>${tag}</div><div class="grid">${btns}</div></div>`;
}

function roundScreen(){
  const ri=view.r,r=E().rounds[ri],i=r.hole,par=S.pars[i],c=calc(r);
  const si=SEGS.findIndex(s=>i>=s.from&&i<s.to),s=SEGS[si];
  const both=r.scores[0][i]!=null&&r.scores[1][i]!=null;
  const bonus=[0,1].map(q=>c.p[q].seg+c.p[q].bounce+c.p[q].streak);
  let h=sampleBar()+`<div class="head">${backIco}<div><div class="lbl">Round ${ri+1}${r.course?' · '+esc(r.course):''}</div><div class="titlerow">${PIN}<h1 class="dsp title">Hole ${i+1}</h1></div></div>${help}</div>`;
  h+=`<div class="seg"><span>Par</span>${[3,4,5].map(n=>`<button class="${par===n?'on':''}" data-a="par" data-v="${n}" aria-pressed="${par===n}">${n}</button>`).join('')}</div>`;
  h+=`<div class="card"><div class="row between"><span class="lbl">${s.name} · ${s.label}</span><span class="tag">Worth ${s.worth}</span></div><div class="segscore"><div><div class="v num">${c.p[0].segs[si]}</div><div class="n">${nm(0)}</div></div><div class="lbl">Pts</div><div><div class="v num">${c.p[1].segs[si]}</div><div class="n">${nm(1)}</div></div></div><div class="sub" style="text-align:center">Bonus so far: ${nm(0)} ${bonus[0]}, ${nm(1)} ${bonus[1]}</div></div>`;
  h+=playerCard(0,r,i)+playerCard(1,r,i);
  if(i===s.to-1&&both){
    const w=c.wins[si];
    h+=`<div class="banner hot">${w===-1?`${s.name} tied. No bonus.`:`${nm(w)} wins ${s.name}. +${s.worth}.`}${si<2?` ${SEGS[si+1].name} starts 0-0.`:''}</div>`;
  }
  h+=`<div class="foot"><button class="btn" data-a="prev" ${i===0?'disabled':''}>Back</button><button class="btn pri grow" data-a="next" ${both?'':'disabled'}>${i===17?'See the card':'Next hole'}</button></div>`;
  return h;
}

function matchScreen(){
  const m=E().match;
  if(!m){
    const[a,b]=totals(),s=startLead(),gap=Math.abs(a-b);

 prev(){hideToast();const r=E().rounds[view.r];if(r.hole>0)r.hole--;save();render();toTop();},
 next(){hideToast();const r=E().rounds[view.r];if(r.hole<17){r.hole++;save();render();toTop();}else{view={s:'results',r:view.r};render();toTop();}},
 fix(){view={s:'round',r:view.r};render();toTop();},
 lock(){E().rounds[view.r].done=true;save();view={s:'week'};render();toTop();},
 skipR3(){E().skipR3=true;save();render();},
 unskip(){E().skipR3=false;save();render();},
 startMatch(){E().match={start:startLead(),holes:[]};save();render();toTop();},
 mhole(el){E().match.holes.push(+el.dataset.v);save();render();toTop();},
 mundo(){E().match.holes.pop();save();view={s:'match'};render();toTop();},
 nextEvent(){const st=mState(E().match);S.history.push({champ:S.names[st.winner],loser:S.names[1-st.winner]});S.event=blankEvent();save();view={s:'home'};render();toTop();},
 reset(){openSheet(`<h2 class="dsp">Reset this event?</h2><p>This clears every round in the current event. Names, pars and events won stay.</p><button class="btn pri big" data-a="resetYes">Reset event</button><button class="btn big well" data-a="close">Keep it</button>`);},
 resetYes(){S.event=blankEvent();save();closeSheet();view={s:'week'};render();},
 async backup(){
  const name=`the-worsters-backup-${new Date().toISOString().slice(0,10)}.json`;
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'The Worsters backup'});}catch(e){}return;}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);
 },
 restore(){document.getElementById('restoreFile').click();},
 restoreYes(){S=rename(pendingRestore);pendingRestore=null;save();closeSheet();view={s:'home'};render();toTop();},
 sampleOn(){realS=S;S=sampleState();sample=true;view={s:'week'};render();toTop();},
 sampleOff(){S=realS;realS=null;sample=false;view={s:'week'};render();toTop();}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('sheetbg')&&e.target!==el)return;
  if(!el.disabled&&act[el.dataset.a])act[el.dataset.a](el);
});
document.addEventListener('input',e=>{if(e.target.id==='course'){S.course=e.target.value;save();}});
document.getElementById('restoreFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const v=JSON.parse(await f.text());
    if(!v||v.v!==1||!v.event||!Array.isArray(v.event.rounds)||v.event.rounds.length!==3||!Array.isArray(v.pars))throw 0;
    pendingRestore=v;
    openSheet(`<h2 class="dsp">Restore this backup?</h2><p>This replaces everything on this phone with the backup from ${esc(new Date(v.updated||Date.now()).toLocaleDateString())}.</p><button class="btn pri big" data-a="restoreYes">Restore backup</button><button class="btn big well" data-a="close">Cancel</button>`);
  }catch(x){openSheet(`<h2 class="dsp">Wrong file</h2><p>That file isn't a Worsters backup.</p><button class="btn pri big" data-a="close">Got it</button>`);}
});
load();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
